<!DOCTYPE html>
<html {{ HTML_ATTRS }}>
  <head {{ HEAD_ATTRS }}>
    <!-- Theme color meta tags for mobile browsers with media query support -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0e1a28"
      media="(prefers-color-scheme: dark)"
    />
    <!-- Fallback theme-color (will be updated by theme script) -->
    <meta name="theme-color" content="#ffffff" />
    <!-- Defer CSS loading to prevent render blocking - must run before HEAD -->
    <script>
      (function () {
        // Defer all stylesheets using the print media trick
        // This prevents CSS from blocking the initial render
        function deferCSS() {
          const stylesheets = document.querySelectorAll(
            'link[rel="stylesheet"]'
          );
          stylesheets.forEach(function (link) {
            // Skip if already processed or is a font stylesheet
            if (
              link.dataset.deferred ||
              link.href.includes("fonts.googleapis.com") ||
              link.href.includes("fonts.gstatic.com")
            ) {
              return;
            }

            // Mark as deferred
            link.dataset.deferred = "true";

            // Use print media trick for non-blocking load
            if (link.media === "" || link.media === "all") {
              link.media = "print";
              link.onload = function () {
                this.media = "all";
                this.onload = null;
              };

              // Fallback: ensure it loads even if onload doesn't fire
              if (link.sheet) {
                link.media = "all";
              } else {
                link.addEventListener("load", function () {
                  this.media = "all";
                });
              }
            }
          });
        }

        // Set up MutationObserver immediately to catch stylesheets as they're added
        if (document.head) {
          const observer = new MutationObserver(function (mutations) {
            mutations.forEach(function (mutation) {
              mutation.addedNodes.forEach(function (node) {
                if (
                  node.nodeName === "LINK" &&
                  node.rel === "stylesheet" &&
                  !node.dataset.deferred &&
                  !node.href.includes("fonts.googleapis.com") &&
                  !node.href.includes("fonts.gstatic.com")
                ) {
                  node.dataset.deferred = "true";
                  if (node.media === "" || node.media === "all") {
                    node.media = "print";
                    node.onload = function () {
                      this.media = "all";
                      this.onload = null;
                    };
                    node.addEventListener("load", function () {
                      this.media = "all";
                    });
                  }
                }
              });
            });
          });

          observer.observe(document.head, {
            childList: true,
            subtree: false,
          });

          // Also run immediately to catch any stylesheets already in the DOM
          deferCSS();
        }

        // Run again when DOM is ready (for any stylesheets added during parsing)
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", deferCSS);
        } else {
          deferCSS();
        }
      })();
    </script>

    <!-- Root URL redirect script - must run first for static hosting -->
    <script>
      (function () {
        // Only redirect if we're on the root path
        const path = window.location.pathname;
        if (path === "/" || path === "") {
          // Get locale from cookie or use default
          const validLocales = ["ua", "ru"];
          const defaultLocale = "ua";

          function getCookie(name) {
            const value = "; " + document.cookie;
            const parts = value.split("; " + name + "=");
            if (parts.length === 2) return parts.pop().split(";").shift();
            return null;
          }

          const cookieLocale = getCookie("locale");
          const targetLocale =
            cookieLocale && validLocales.includes(cookieLocale)
              ? cookieLocale
              : defaultLocale;

          // Get query string and hash if present
          const search = window.location.search || "";
          const hash = window.location.hash || "";

          // Redirect immediately
          const redirectPath = "/" + targetLocale + search + hash;
          if (window.location.pathname !== redirectPath) {
            window.location.replace(redirectPath);
            return; // Stop execution
          }
        }
      })();
    </script>
    <!-- Theme initialization script - must run before page render to prevent flash -->
    <script>
      (function () {
        const THEME_STORAGE_KEY = "app-theme";
        const THEME_LIGHT = "light";
        const THEME_DARK = "dark";

        function getStoredTheme() {
          try {
            return localStorage.getItem(THEME_STORAGE_KEY);
          } catch (e) {
            return null;
          }
        }

        function getSystemTheme() {
          if (window.matchMedia) {
            return window.matchMedia("(prefers-color-scheme: dark)").matches
              ? THEME_DARK
              : THEME_LIGHT;
          }
          return THEME_LIGHT;
        }

        function applyTheme(theme) {
          const root = document.documentElement;
          if (theme === THEME_DARK) {
            root.classList.add("theme-dark");
            root.classList.remove("theme-light");
          } else {
            root.classList.add("theme-light");
            root.classList.remove("theme-dark");
          }

          // Update theme-color meta tags (both light and dark)
          // Update the appropriate meta tag based on theme
          const metaThemeColorLight = document.querySelector(
            'meta[name="theme-color"][media="(prefers-color-scheme: light)"]'
          );
          const metaThemeColorDark = document.querySelector(
            'meta[name="theme-color"][media="(prefers-color-scheme: dark)"]'
          );

          // Also update a fallback theme-color without media query for browsers that don't support media queries
          let metaThemeColorFallback = document.querySelector(
            'meta[name="theme-color"]:not([media])'
          );

          // If no fallback exists, create one
          if (!metaThemeColorFallback) {
            metaThemeColorFallback = document.createElement("meta");
            metaThemeColorFallback.setAttribute("name", "theme-color");
            document.head.appendChild(metaThemeColorFallback);
          }

          // Update fallback to match current theme
          metaThemeColorFallback.setAttribute(
            "content",
            theme === THEME_DARK ? "#0e1a28" : "#ffffff"
          );
        }

        // Apply theme immediately
        const storedTheme = getStoredTheme();
        const theme = storedTheme || getSystemTheme();
        applyTheme(theme);

        // Preload background image based on current theme
        function preloadBackgroundImage(theme) {
          const bgImage =
            theme === THEME_DARK ? "/images/bg_dark.png" : "/images/bg.png";
          const link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.href = bgImage;
          link.setAttribute("fetchpriority", "high");
          document.head.appendChild(link);
        }

        // Preload the appropriate background image
        preloadBackgroundImage(theme);
      })();
    </script>
  </head>
