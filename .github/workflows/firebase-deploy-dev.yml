name: Deploy to Firebase App Hosting (dev branch)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ETAGE_STATIC_APP }}
      
      - uses: google-github-actions/setup-gcloud@v2
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      
      - name: Deploy to Firebase App Hosting
        run: firebase apphosting:rollouts:create etage-app --git-branch dev --project etage-static-app
